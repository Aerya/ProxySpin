name: Trivy security scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fully updated image
        run: docker build --pull --no-cache -t proxyspin:trivy .

      - name: Verify Pebble was removed
        run: |
          docker run --rm --entrypoint sh proxyspin:trivy \
            -c 'test ! -e /usr/bin/pebble'

      - name: Generate SARIF report
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: proxyspin:trivy
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload results to Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
        continue-on-error: true

      - name: Block PR on fixable HIGH or CRITICAL vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: proxyspin:trivy
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate scheduled JSON report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: proxyspin:trivy
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Open, update or close security issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("trivy.json", "utf8"));
            const rows = [];

            for (const result of report.Results || []) {
              for (const vulnerability of result.Vulnerabilities || []) {
                if (!vulnerability.FixedVersion) continue;

                rows.push({
                  severity: vulnerability.Severity,
                  id: vulnerability.VulnerabilityID,
                  pkg: vulnerability.PkgName,
                  installed: vulnerability.InstalledVersion,
                  fixed: vulnerability.FixedVersion,
                  target: result.Target || "",
                });
              }
            }

            const title = "Trivy : vulnérabilités corrigibles à examiner";

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security,automated",
            });

            const existing = issues.data.find(
              issue => issue.title === title
            );

            if (rows.length === 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }

              core.info("Aucune vulnérabilité HIGH/CRITICAL corrigible.");
              return;
            }

            const table = rows.map(v =>
              `| ${v.severity} | ${v.id} | ${v.pkg} | ${v.installed} | ${v.fixed} | ${v.target} |`
            ).join("\n");

            const body = [
              "Le rebuild sans cache, avec mise à niveau Ubuntu, laisse encore les vulnérabilités corrigibles suivantes :",
              "",
              "| Gravité | CVE | Paquet | Installé | Correctif | Cible |",
              "|---|---|---|---|---|---|",
              table,
              "",
              "Cette issue est mise à jour automatiquement chaque lundi.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security", "automated"],
              });
            }
